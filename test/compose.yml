# Warehouses for the container tests (test/test_containers.py).
#
#   just test-all            everything, start to finish
#   just containers-up       or step by step
#   just test-containers
#   just containers-down
#
# Ports are deliberately not the defaults, so these can run next to a
# database you already have. Nothing is stored outside the containers.
name: dbt-ls-containers

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbt_ls
    ports:
      - "${DBT_LS_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbt_ls"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DBT_LS_TEST_MYSQL_PORT:-53306}:3306"
    healthcheck:
      # Over TCP: the server that runs during first-time setup has no network.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -proot -e 'select 1'"]
      interval: 2s
      timeout: 5s
      retries: 60

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dbt-ls-test-1"
      MSSQL_PID: Developer
    ports:
      - "${DBT_LS_TEST_SQLSERVER_PORT:-51433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dbt-ls-test-1 -Q 'select 1' -b"]
      interval: 3s
      timeout: 5s
      retries: 60

  spark:
    image: apache/spark:4.0.0
    command: /opt/spark/sbin/start-connect-server.sh
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${DBT_LS_TEST_SPARK_PORT:-55002}:15002"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/15002'"]
      interval: 3s
      timeout: 5s
      retries: 60
