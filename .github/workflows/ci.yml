name: CI

on:
  push:
    branches:
      - main
    tags:
      - '0.*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v6
      
      - run: uv sync

      - name: Run tests
        run: uv run pytest -vv

  containers:
    # The warehouse readers against real Postgres, MySQL, SQL Server and Spark.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v6

      - run: uv sync

      - name: Install the SQL Server ODBC driver if the runner lacks it
        run: |
          if ! dpkg -s msodbcsql18 >/dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi

      - uses: extractions/setup-just@v3

      - name: Start the warehouses
        run: just containers-up

      # A warehouse that did not start is a failure here, not a skip.
      - name: Run container tests
        run: just test-containers -vv

      - name: Show warehouse logs
        if: failure()
        run: docker compose -f test/compose.yml logs --tail 200

  build:
    # Runs only when a version tag is pushed.
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')
    needs:
      - test
      - containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Hatch
        run: pip install hatch

      - name: Verify tag matches project version
        run: |
          VERSION="$(hatch version)"
          TAG="${GITHUB_REF_NAME#v}"
          echo "Project version: $VERSION"
          echo "Tag version:     $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match project version '$VERSION'."
            exit 1
          fi

      - name: Build
        run: hatch build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      PYPI_API_KEY: ${{ secrets.PYPI_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v6

      - run: uv publish --token $PYPI_API_KEY
